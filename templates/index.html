<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BunkVauth SSO - Secure Access</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            justify-content: center;
            align-items: center;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 3rem 2.5rem;
            text-align: center;
        }
        .logo-box {
            width: 64px;
            height: 64px;
            background: var(--primary-gradient);
            border-radius: 1rem;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
        .logo-box svg { width: 32px; height: 32px; fill: white; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: var(--text-muted); margin-bottom: 2.5rem; }
        #message {
            margin-top: 1.5rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            display: none;
        }
        .error { background: rgba(248, 113, 113, 0.1); color: var(--error); border: 1px solid rgba(248, 113, 113, 0.2); }
        .success { background: rgba(74, 222, 128, 0.1); color: var(--success); border: 1px solid rgba(74, 222, 128, 0.2); }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--surface-border);
        }
        .divider span { padding: 0 1rem; }
    </style>
</head>
<body>
    <button id="themeToggle" class="theme-toggle" title="Toggle Theme">
        <svg id="sunIcon" style="display:none; width:20px;height:20px" viewBox="0 0 24 24"><path fill="currentColor" d="M12,7L12,7C10.5,7,9.2,7.7,8.4,8.9C8.1,9.3,8,9.8,8,10.3V10.3C8,12.3,9.7,14,11.7,14h0.6c2,0,3.7-1.7,3.7-3.7v0c0-0.5-0.1-1-0.4-1.4C14.8,7.7,13.5,7,12,7z M12,2L12,4 M12,20L12,22 M3.5,4.9l1.4,1.4 M19.1,20.5l1.4,1.4 M2,12h2 M20,12h2 M3.5,19.1l1.4-1.4 M19.1,3.5l1.4,1.4"/></svg>
        <svg id="moonIcon" style="width:20px;height:20px" viewBox="0 0 24 24"><path fill="currentColor" d="M17.75,4.09L15.22,6.03L16.13,9.09L13.5,7.28L10.87,9.09L11.78,6.03L9.25,4.09L12.44,4L13.5,1L14.56,4L17.75,4.09M21.25,11L19.61,12.25L20.2,14.23L18.5,13.06L16.8,14.23L17.39,12.25L15.75,11L17.81,10.95L18.5,9L19.19,10.95L21.25,11M18.97,15.91C17.41,15.33 15.62,15 13.77,15C10.53,15 7.66,15.97 5.86,17.5C5.07,18.18 4.67,18.73 4.39,19.22C4.12,19.71 4,20.17 4,20.5C4,20.78 4.11,21 4.32,21.12C4.53,21.25 4.83,21.3 5.11,21.26C5.4,21.22 5.7,21.1 6,20.95L11,18.45C11.91,18 12.83,17.75 13.77,17.75C14.71,17.75 15.63,18 16.54,18.45L21.54,20.95C21.84,21.1 22.14,21.22 22.43,21.26C22.71,21.3 23.01,21.25 23.22,21.12C23.43,21 23.54,20.78 23.54,20.5C23.54,20.17 23.42,19.71 23.15,19.22C22.87,18.73 22.47,18.18 21.68,17.5C20.84,16.78 19.89,16.22 18.97,15.91Z"/></svg>
    </button>

    <div class="login-card glass-card animate-in">
        <div class="logo-box">
            <svg viewBox="0 0 24 24"><path d="M12,1L3,5V11C3,16.55 6.84,21.74 12,23C17.16,21.74 21,16.55 21,11V5L12,1M12,3.19L19,6.3V11C19,15.29 16.14,19.34 12,20.4C7.86,19.34 5,15.29 5,11V6.3L12,3.19M12,7C10.89,7 10,7.89 10,9V11H9V15H15V11H14V9C14,7.89 13.11,7 12,7M12,8A1,1 0 0,1 13,9V11H11V9A1,1 0 0,1 12,8Z" /></svg>
        </div>
        <h1>BunkVauth SSO</h1>
        <p class="subtitle">Next-generation biometric authentication</p>

        <div class="input-group">
            <label for="username">Corporate Username</label>
            <input type="text" id="username" placeholder="User Name" required>
        </div>

        <button id="loginBtn" class="btn btn-primary" style="width: 100%;">
            <svg style="width:18px;height:18px" viewBox="0 0 24 24"><path fill="currentColor" d="M12,17V12H7V10H12V5L19,11L12,17Z" /></svg>
            Sign In with Biometrics
        </button>

        <div class="divider"><span>OR</span></div>

        <button id="registerBtn" class="btn btn-secondary" style="width: 100%;">
            Register New Device
        </button>

        <div id="message"></div>
    </div>

    <script src="/static/js/collector.js"></script>
    <script>
        // Theme Management
        const toggle = document.getElementById('themeToggle');
        const sun = document.getElementById('sunIcon');
        const moon = document.getElementById('moonIcon');
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            if (theme === 'dark') {
                sun.style.display = 'block';
                moon.style.display = 'none';
            } else {
                sun.style.display = 'none';
                moon.style.display = 'block';
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);

        toggle.onclick = () => {
            const current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        };

        function bufferDecode(value) { return Uint8Array.from(atob(value.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0)); }
        function bufferEncode(value) { return btoa(String.fromCharCode.apply(null, new Uint8Array(value))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, ""); }
        
        const msgEl = document.getElementById('message');
        const showMsg = (text, isError = false) => { 
            msgEl.textContent = text; 
            msgEl.className = isError ? 'error' : 'success'; 
            msgEl.style.display = 'block';
        };

        document.getElementById('registerBtn').onclick = async () => {
            const username = document.getElementById('username').value;
            if (!username) return showMsg('Please enter a username', true);
            showMsg('Initializing registration...', false);
            try {
                const beginRes = await fetch('/register/begin', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username}) });
                const options = await beginRes.json();
                if (options.error) throw new Error(options.error);

                options.challenge = bufferDecode(options.challenge);
                options.user.id = bufferDecode(options.user.id);
                if (options.excludeCredentials) options.excludeCredentials.forEach(c => c.id = bufferDecode(c.id));

                const credential = await navigator.credentials.create({ publicKey: options });
                const completeRes = await fetch('/register/complete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        id: credential.id,
                        rawId: bufferEncode(credential.rawId),
                        type: credential.type,
                        response: { attestationObject: bufferEncode(credential.response.attestationObject), clientDataJSON: bufferEncode(credential.response.clientDataJSON) }
                    })
                });
                const result = await completeRes.json();
                if (result.status === 'success') showMsg('Device successfully registered!'); else throw new Error(result.error);
            } catch (err) { showMsg(err.message, true); }
        };

        document.getElementById('loginBtn').onclick = async () => {
            const username = document.getElementById('username').value;
            if (!username) return showMsg('Please enter a username', true);
            showMsg('Verifying biometrics...', false);
            try {
                const beginRes = await fetch('/login/begin', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username}) });
                const options = await beginRes.json();
                if (options.error) throw new Error(options.error);

                options.challenge = bufferDecode(options.challenge);
                options.allowCredentials.forEach(c => c.id = bufferDecode(c.id));
                const assertion = await navigator.credentials.get({ publicKey: options });
                const completeRes = await fetch('/login/complete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        id: assertion.id,
                        rawId: bufferEncode(assertion.rawId),
                        type: assertion.type,
                        response: { authenticatorData: bufferEncode(assertion.response.authenticatorData), clientDataJSON: bufferEncode(assertion.response.clientDataJSON), signature: bufferEncode(assertion.response.signature) }
                    })
                });
                const result = await completeRes.json();
                if (result.status === 'success') window.location.href = '/dashboard'; else throw new Error(result.error);
            } catch (err) { showMsg(err.message, true); }
        };
    </script>
</body>
</html>
